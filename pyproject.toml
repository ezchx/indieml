[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indieml"
version = "0.1.7"
description = "A Python and MCP integration library for the IndieML Substance API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]"
]

[project.scripts]
indieml = "indieml.mcp.server:main"
