[project]
name = "indieml-mcp-server"
version = "0.1.0"
description = "MCP server for the IndieML Substance API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "httpx"
]
[project.scripts]
indieml-mcp-server = "server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
