version: 1
displayName: IndieML Substance Engine
description: A fast, deterministic pre-screening endpoint that evaluates the structural substance and information density of digital text.
homepage: https://indieml.app
icon: https://indieml.app/images/final-logo.svg 

startCommand:
  type: stdio
  command: npx
  args:
    - "-y"
    - "mcp-remote"
    - "https://indieml.app/mcp/"
    - "--header"
    - "X-Api-Key:${INDIEML_API_KEY}"

configSchema:
  type: object
  required:
    - INDIEML_API_KEY
  properties:
    INDIEML_API_KEY:
      type: string
      description: Your IndieML API key. Request a free key at https://indieml.app
